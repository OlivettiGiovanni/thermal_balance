# INPUT TEMPLATE: supply a cylinder-simulation CSV specific to this material.
# The absorption_file path deliberately names a file not bundled here.
# Geometry, n_0 and simulation calibration below are starting assumptions;
# replace them with the actual simulation metadata before quantitative use.

[material]
name = "Crystalline Si"
wavelength_nm = 1550.0 # Laser wavelength [nm]
n_0 = 3.48 # ASSUMED refractive index used in the cylinder simulation
reference_temperature_k = 300.0 # T0 [K]; optical baseline and relaxation-time reference

[data]
# Paths are relative to this TOML file, independent of the working directory.
optical_file = "../data/material/Si_crystalline.csv" # Material n,k versus wavelength and temperature
absorption_file = "../data/user_optics/Si_crystalline_cylinders.csv" # Cylinder radius,height,p_abs_W

[geometry]
radius_nm = "max_peak" # Radius [nm], "first_peak", or "max_peak"
height_nm = 400.0 # Height [nm]; must match the imported cylinder simulation

[linear]
# ASSUMED simulation calibration; alpha=4*pi*k/lambda in inverse metres.
simulation_alpha_m_inv = 1.0
simulation_intensity_w_um2 = 0.1

[tpa]
weights = [2.33e-12, 2.138e-11] # SI: m / (W eV^3.5), one per phonon branch
phonon_temperatures_k = [212.0, 670.0] # Phonon temperatures [K]
# E_g(T) = gap0_ev - gap_slope_ev_k * T^2 / (T + gap_temperature_k).
gap0_ev = 1.156
gap_slope_ev_k = 7.021e-4
gap_temperature_k = 1108.0 # Gap-law temperature [K]

[fca]
conductivity_masses_m0 = [0.3, 0.4] # electron, hole; free-electron mass units
# n_i(T) = A_i * T^1.5 * exp(-activation_ev_i / (k_B*T)).
density_prefactors = [3.87e22, 3.87e22] # m^-3 K^-1.5
activation_ev = [0.605, 0.605] # Carrier activation energies [eV]
# Relaxation times add: tau_i(T) = sum_j tau0_ji * (T/T0)^p_ji; Gamma_i = 1/tau_i.
# Each relaxation_times_s entry is a contribution at T0, in seconds [s].
relaxation_times_s = [[1.5010063493845713e-14, 1.2349188601754881e-14], [2.1352024221262788e-13, 9.25544073276513e-14]]
temperature_exponents = [[-0.57, -0.57], [-2.33, -2.23]]

[bga]
sqrt_weights = [50.4, 1808.0] # m^-1 eV^-0.5, one per phonon branch
quadratic_weights = [39200.0, 576000.0] # m^-1 eV^-2
quadratic_offset_ev = 0.0055
phonon_temperatures_k = [212.0, 670.0] # Phonon temperatures [K]
gap0_ev = 1.155
gap_slope_ev_k = 4.73e-4
gap_temperature_k = 635.0 # Gap-law temperature [K]

[experiment]
intensity_w_um2 = 0.1 # Incident experimental laser intensity
bath_temperature_k = 300.0 # Bath temperature [K]
reference_pressure_mbar = 0.1
temperature_max_k = 1600.0 # Upper calculation temperature [K]

[gas]
mass_amu = 28.965 # Air effective molecular mass
gamma = 1.4 # Heat-capacity ratio
accommodation = 0.8 # Assumed energy-accommodation coefficient

[radiation]
# Use supported n(lambda,T), k(lambda,T); otherwise the reference spectrum.
wavelength_range_um = [0.3, 100.0]
